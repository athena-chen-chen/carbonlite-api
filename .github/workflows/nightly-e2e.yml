name: Isolated Prisma Checkpoint A/B (manual only)
'on':
  workflow_dispatch:
    inputs:
      entry_sha:
        description: Independently approved published workflow commit (40 lowercase hex)
        type: string
        required: true
      entry_tree:
        description: Independently approved published workflow tree (40 lowercase hex)
        type: string
        required: true
      entry_index_sha256:
        description: Independently approved bundle checksum index (64 lowercase hex)
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: founder-pilot-exact-pair
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  ENTRY_SHA: ${{ inputs.entry_sha }}
  ENTRY_TREE: ${{ inputs.entry_tree }}
  ENTRY_INDEX_SHA256: ${{ inputs.entry_index_sha256 }}
  INVOKING_WORKFLOW_SHA: ${{ github.workflow_sha }}
jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        arm: [A, B]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonlite_ci_test
        ports:
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbonlite_ci_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer@sha256:53d98b3174b0842c475b9842fb0a733b2d9f7ec9da834ec42252aa553f48c628
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: carbonlite_ci_test
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 2
          MAX_CLIENT_CONN: 30
        ports:
          - 55448:5432
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - name: Require isolated immutable manual context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = athena-chen-chen/carbonlite-api
          test "$GITHUB_REF" = refs/heads/ci/pilot-checkpoint-ab
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          [[ "$ENTRY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ENTRY_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ENTRY_INDEX_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$ENTRY_SHA" = "$INVOKING_WORKFLOW_SHA"
          test "$ENTRY_SHA" = "$GITHUB_SHA"
      - name: Checkout immutable experiment separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: ${{ github.workflow_sha }}
          path: entry
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged reviewed controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: 472120fc7d27f9b56ed6ae3f1e67d602ca2b1f90
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable backend only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: e424c567d43c0086e0dc01b86e48cb648c114078
          path: carbonlite-api
          fetch-depth: 0
          persist-credentials: false
      - name: Verify identities and complete manifests before dependencies
        id: identity
        run: python3 -I entry/ci/pilot-checkpoint-ab/verify.py
      - name: Experiment helper regressions only
        run: python3 -m unittest discover -s entry/ci/pilot-checkpoint-ab -p test_local.py -v
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.17.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Provision frozen dependencies and pinned engine without Prisma CLI
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir carbonlite-api install --frozen-lockfile >/dev/null 2>&1
          cd carbonlite-api
          env -i PATH="$PATH" CI=true node -e 'const {createRequire}=require("module");if(require("prisma/package.json").version!=="6.19.3")process.exit(1);const r=createRequire(require.resolve("prisma/package.json"));const e=r("@prisma/engines");const f=createRequire(r.resolve("@prisma/engines"))("@prisma/fetch-engine");e.ensureNeededBinariesExist({clientEngineType:"library",download:f.download}).catch(()=>process.exitCode=1)' >/dev/null 2>&1
          cd ..
          python3 -I entry/ci/pilot-checkpoint-ab/verify.py
      - name: Create dedicated UID and disposable empty home
        shell: bash
        run: |
          set -euo pipefail
          ! getent passwd 24001 >/dev/null
          ! id clpairtest >/dev/null 2>&1
          sudo useradd --create-home --uid 24001 clpairtest
          sudo chown -R clpairtest:clpairtest carbonlite-api
          mkdir -m 755 checkpoint-disposable
          sudo install -d -m 700 -o clpairtest -g clpairtest checkpoint-disposable/home
          bash control/ci/pilot-exact-pair/runner-access.sh "$GITHUB_WORKSPACE" "$(id -u)" "$(id -g)" >/dev/null 2>&1
      - name: One arm with unchanged outbound denial
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POOLER_CONTAINER: ${{ job.services.pgbouncer.id }}
        run: python3 -I entry/ci/pilot-checkpoint-ab/run.py arm "$ARM"
      - name: Always remove only these disposable service containers
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POOLER_CONTAINER: ${{ job.services.pgbouncer.id }}
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for container in "$POSTGRES_CONTAINER" "$POOLER_CONTAINER"; do
            [[ "$container" =~ ^[0-9a-f]{64}$ ]]
            docker rm -f "$container" >/dev/null
          done
      - name: Final identities counters and cleanup receipt
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POOLER_CONTAINER: ${{ job.services.pgbouncer.id }}
        if: always() && steps.identity.outcome == 'success'
        run: python3 -I entry/ci/pilot-checkpoint-ab/run.py finalize "$ARM"
      - name: Validate exact bounded upload schema
        id: export
        if: always() && steps.identity.outcome == 'success'
        run: python3 -I entry/ci/pilot-checkpoint-ab/run.py export "$ARM"
      - name: Upload this arm even when its security gate fails
        if: always() && steps.export.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: checkpoint-${{ matrix.arm }}
          path: checkpoint-results/arm-${{ matrix.arm }}.json
          retention-days: 7
          if-no-files-found: error
  compare:
    if: always()
    needs: migration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable experiment separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: ${{ github.workflow_sha }}
          path: entry
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout unchanged controls
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: 472120fc7d27f9b56ed6ae3f1e67d602ca2b1f90
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout immutable backend for final identity verification only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: e424c567d43c0086e0dc01b86e48cb648c114078
          path: carbonlite-api
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact experiment controls and backend before artifact reading
        run: python3 -I entry/ci/pilot-checkpoint-ab/verify.py
      - name: Download only this run's two bounded arm artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: checkpoint-*
          path: downloaded
          merge-multiple: false
      - name: Compare evidence without masking any failed network gate
        run: python3 -I entry/ci/pilot-checkpoint-ab/run.py compare fixed
