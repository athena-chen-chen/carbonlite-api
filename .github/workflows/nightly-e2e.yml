name: Founder Pilot exact-pair validation (manual only)
'on':
  workflow_dispatch:
    inputs:
      frontend_sha:
        description: Reviewed frontend candidate commit (40 lowercase hex characters)
        required: true
        type: string
      backend_sha:
        description: Reviewed backend candidate commit (40 lowercase hex characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: founder-pilot-exact-pair
  cancel-in-progress: false
jobs:
  exact-pair:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carbonlite_ci_test
        ports:
          - 55447:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d carbonlite_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      pgbouncer:
        image: edoburu/pgbouncer@sha256:53d98b3174b0842c475b9842fb0a733b2d9f7ec9da834ec42252aa553f48c628
        env:
          DB_HOST: postgres
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: carbonlite_ci_test
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          DEFAULT_POOL_SIZE: 2
          MAX_CLIENT_CONN: 30
          ADMIN_USERS: postgres
        ports:
          - 55448:5432
    steps:
      - name: Require the approved repository, manual event and full commit inputs
        shell: bash
        env:
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = athena-chen-chen/carbonlite-api
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/ci/pilot-exact-pair-final
          [[ "$FRONTEND_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out the exact validation workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed v4 revision
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Check out exact frontend candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed v4 revision
        with:
          repository: athena-chen-chen/carbonlite-web
          ref: ${{ inputs.frontend_sha }}
          path: carbonlite-web
          fetch-depth: 0
          persist-credentials: false
      - name: Check out exact backend candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed v4 revision
        with:
          repository: athena-chen-chen/carbonlite-api
          ref: ${{ inputs.backend_sha }}
          path: carbonlite-api
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both complete trees and reviewed file manifests before installing
        env:
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 control/ci/pilot-exact-pair/verify.py
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # reviewed v4 revision
        with:
          version: 10.17.0
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # reviewed v4 revision
        with:
          node-version: '20'
      - name: Install unchanged lockfiles (no deployment credentials)
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir carbonlite-api install --frozen-lockfile
          pnpm --dir carbonlite-web install --frozen-lockfile
      - name: Recheck source identity after dependency installation
        env:
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 control/ci/pilot-exact-pair/verify.py
      - name: Prepare the disposable test account and generated client
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          ! id clpairtest >/dev/null 2>&1
          ! getent passwd 24001 >/dev/null
          sudo useradd --create-home --uid 24001 clpairtest
          # Existing Control E2E uses docker exec against the disposable services.
          sudo usermod -aG docker clpairtest
          mkdir -p pair-results/validation
          sudo chown -R clpairtest:clpairtest carbonlite-api carbonlite-web pair-results/validation
          bash control/ci/pilot-exact-pair/runner-access.sh "$GITHUB_WORKSPACE" "$(id -u)" "$(id -g)"
          sudo -H -u clpairtest env -i PATH="$PATH" POSTGRES_CONTAINER="$POSTGRES_CONTAINER" \
            python3 "$GITHUB_WORKSPACE/control/ci/pilot-exact-pair/run.py" "$GITHUB_WORKSPACE" generate
      - name: Close and verify test-process outbound networking
        id: network
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          POOLER_CONTAINER: ${{ job.services.pgbouncer.id }}
        shell: bash
        run: |
          set -euo pipefail
          bash control/ci/pilot-exact-pair/network.sh enable
          # Reserved documentation address; packets must be locally rejected.
          sudo -H -u clpairtest env -i PATH="$PATH" python3 - <<'PY'
          import socket
          try:
              socket.create_connection(('192.0.2.1', 443), timeout=2)
          except OSError:
              pass
          else:
              raise SystemExit('Outbound isolation failed')
          PY
          blocked="$(sudo iptables -L CLPAIR_EGRESS -n -v -x | awk '$3=="REJECT" {print $1}')"
          test "$blocked" -gt 0
          date -u +%s%6N > pair-results/network-since-us.txt
          sudo iptables -Z CLPAIR_EGRESS
          sudo ip6tables -Z CLPAIR_EGRESS
          echo 'OUTBOUND_GUARD_PREFLIGHT: PASS' | tee pair-results/network-preflight.txt
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Run exact-pair synthetic validation with no inherited credentials
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          sudo -H -u clpairtest env -i PATH="$PATH" POSTGRES_CONTAINER="$POSTGRES_CONTAINER" \
            python3 "$GITHUB_WORKSPACE/control/ci/pilot-exact-pair/run.py" "$GITHUB_WORKSPACE" validate
      - name: Fail on unexpected outbound attempts, even when a test caught the error
        if: ${{ always() && steps.network.outputs.enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # Independent diagnostics cannot mask the counter failure, and vice versa.
          set +e
          bash control/ci/pilot-exact-pair/network.sh check | tee pair-results/network-status.txt
          counter_status=${PIPESTATUS[0]}
          since_us="$(cat pair-results/network-since-us.txt)"
          [[ "$since_us" =~ ^[0-9]{16}$ ]] || exit 1
          # Read header-only kernel records since this capture window; no payload logging.
          sudo journalctl -k --since="@$((since_us / 1000000))" -o json --no-pager -n 2048 \
            | python3 control/ci/pilot-exact-pair/diagnostics.py network "$since_us" \
                pair-results/network-events.json pair-results/validation/stage-intervals.json pair-results/network-status.txt
          diagnostic_status=$?
          set -e
          test "$counter_status" = 0
          test "$diagnostic_status" = 0
      - name: Verify reviewed source stayed unchanged through validation
        if: ${{ always() && steps.network.outputs.enabled == 'true' }}
        env:
          FRONTEND_SHA: ${{ inputs.frontend_sha }}
          BACKEND_SHA: ${{ inputs.backend_sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 control/ci/pilot-exact-pair/verify.py
      - name: Upload only sanitized identity, summary and compiler evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # reviewed v4 revision
        with:
          name: founder-pilot-exact-pair-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            pair-results/identity.json
            pair-results/validation/tests.json
            pair-results/validation/test-types-baseline.txt
            pair-results/validation/test-types-candidate.txt
            pair-results/validation/type-debt-policy.json
            pair-results/network-preflight.txt
            pair-results/network-status.txt
            pair-results/network-events.json
            pair-results/validation/stage-intervals.json
            pair-results/validation/*.failures.json
